<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BEXY TV</title>
</head>
<body style="background:#000000; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; font-family:sans-serif;">
    <div style="text-align:center;">
        <div style="border:4px solid rgba(255,255,255,0.1); border-top:4px solid #f59e0b; border-radius:50%; width:50px; height:50px; animation:spin 1s linear infinite; margin:0 auto 20px;"></div>
        <p style="font-weight:bold; font-size:18px;">Lancement BEXY TV...</p>
    </div>
    <!-- FOR ANDROID APK COMPATIBILITY: url=https://specialists-wedding-cigarette-invitation.trycloudflare.com -->
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    <script>
        const fallbackUrl = "https://specialists-wedding-cigarette-invitation.trycloudflare.com/mobile";
        fetch("https://ntfy.sh/bexytv-internal-url-998877/json?poll=1")
            .then(r => r.text())
            .then(text => {
                const lines = text.trim().split("\n");
                const lastLine = lines[lines.length - 1];
                if (lastLine) {
                    const data = JSON.parse(lastLine);
                    if (data.message && data.message.includes("trycloudflare.com")) {
                        window.location.replace(data.message + "/mobile");
                        return;
                    }
                }
                window.location.replace(fallbackUrl);
            })
            .catch(() => {
                window.location.replace(fallbackUrl);
            });
    </script>
</body>
</html>
